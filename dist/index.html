<style>
:root{--nav-purple:light-dark(#6f3cc3,#be95ff);--nav-bg:light-dark(#fff,#201e25);--nav-border:light-dark(#d6d1dd,#4b4455);--nav-text:light-dark(#302936,#f0eaf7)}
body{padding:0 0 0 248px!important;background:light-dark(#f5f5f7,#17171b)!important}
iframe{display:block;width:100%;max-width:1180px;min-height:100vh;height:100vh;margin:0 auto;border:0}
#training-nav{position:fixed;inset:0 auto 0 0;width:248px;z-index:20;background:var(--nav-bg);border-right:1px solid var(--nav-border);color:var(--nav-text);font-family:Arial,sans-serif;overflow-y:auto}
.training-nav-inner{display:flex;flex-direction:column;min-height:100%;padding:0}
.training-nav-brand{display:flex;align-items:center;gap:10px;min-height:74px;padding:12px 16px;border-bottom:1px solid var(--nav-border);font-size:.93rem;font-weight:700;white-space:nowrap;color:var(--nav-text)}
.training-nav-brand img{width:42px;height:42px;object-fit:cover;border:2px solid var(--nav-purple);animation:avatar-breathe 2.6s ease-in-out infinite}
@keyframes avatar-breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.training-nav-links{display:grid;width:100%;padding:8px 0 24px}
.training-nav-links button{display:flex;align-items:center;gap:11px;min-height:46px;width:100%;padding:9px 13px;border:0;border-left:3px solid transparent;border-bottom:1px solid var(--nav-border);border-radius:0;background:transparent;color:var(--nav-text);font:600 .88rem Arial,sans-serif;text-align:left;cursor:pointer}
.training-nav-links button:hover,.training-nav-links button:focus-visible{background:light-dark(#f0eaf8,#342b40)}
.training-nav-links button[aria-current=page]{border-left-color:var(--nav-purple);background:light-dark(#f0eaf8,#342b40);color:var(--nav-purple)}
.training-nav-links svg{width:18px;height:18px;flex:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:square;stroke-linejoin:miter;fill:none}
.training-nav-links svg text{fill:currentColor;stroke:none;font:700 11px Arial,sans-serif}
.training-nav-links button:focus-visible,#nav-toggle:focus-visible{outline:2px solid var(--nav-purple);outline-offset:-2px}
#nav-toggle{display:none}
@media(max-width:760px){
 body{padding-left:56px!important}
 #training-nav{width:56px;overflow-x:hidden;box-shadow:2px 0 10px #0002}
 #training-nav[aria-expanded=true]{width:min(248px,86vw)}
 .training-nav-brand{padding:7px;min-height:56px}
 .training-nav-brand img{width:40px;height:40px}
 .training-nav-brand span{display:none}
 #nav-toggle{display:block;margin:7px;padding:8px 6px;width:40px;background:transparent;color:var(--nav-text);border:1px solid var(--nav-border);font-size:1.1rem}
 .training-nav-links{display:none}
 #training-nav[aria-expanded=true] .training-nav-links{display:grid}
 #training-nav[aria-expanded=true] .training-nav-brand span{display:inline}
 iframe{width:100%;max-width:none}
}
@media(prefers-reduced-motion:reduce){.training-nav-brand img{animation:none}}
</style>

&lt;style&gt;
#training-checklist-v1{--tc-surface:light-dark(#f4f4f7,#17171b);--tc-card:light-dark(#fff,#222127);--tc-tonal:light-dark(#f0eaf8,#342b40);--tc-primary:light-dark(#6f3cc3,#be95ff);--tc-on-primary:#fff;--tc-ink:light-dark(#211b2b,#f3eff8);--tc-muted:light-dark(#5f586a,#bdb2ca);--tc-line:light-dark(#d9d3e1,#51445f);font-family:Arial,Helvetica,sans-serif;color:var(--tc-ink);background:var(--tc-surface);padding:0 0 28px;box-sizing:border-box}
#training-checklist-v1 *{box-sizing:border-box}
#training-checklist-v1 .tc-topbar{min-height:52px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 24px;background:#2b173f;color:#fff}
#training-checklist-v1 .tc-brand{display:flex;align-items:center;gap:12px;font-size:1.05rem;font-weight:700;letter-spacing:.005em}
#training-checklist-v1 .tc-brand-mark{display:grid;place-items:center;width:30px;height:30px;background:#8b5bd1;color:#fff;font-size:.95rem}
#training-checklist-v1 .tc-period{font-size:.875rem;color:#e4d7f3;white-space:nowrap}
#training-checklist-v1 .tc-navbar{display:flex;gap:0;overflow-x:auto;white-space:nowrap;background:light-dark(#e9e4ef,#292132);border-bottom:1px solid var(--tc-line);padding:0 16px}
#training-checklist-v1 .tc-nav-link{display:inline-flex;align-items:center;min-height:48px;padding:0 16px;color:var(--tc-ink);text-decoration:none;border-bottom:3px solid transparent;font-size:.875rem;font-weight:600}
#training-checklist-v1 .tc-nav-link:hover,#training-checklist-v1 .tc-nav-link:focus-visible{background:var(--tc-tonal);border-bottom-color:var(--tc-primary)}
#training-checklist-v1 .tc-nav-link[hidden]{display:none}
#training-checklist-v1 h3{font-size:1.18rem;letter-spacing:-.01em;margin:0}
#training-checklist-v1 .tc-phase{margin:20px 24px 0;padding:20px;background:var(--tc-card);border:1px solid var(--tc-line);border-left:4px solid var(--tc-primary)}
#training-checklist-v1 .tc-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
#training-checklist-v1 .tc-heading .text-small{background:var(--tc-tonal);padding:5px 10px;color:var(--tc-muted)}
#training-checklist-v1 .text-small,#training-checklist-v1 .tc-date{color:var(--tc-muted)}
#training-checklist-v1 #tc-status{margin:22px 24px 6px;font-weight:700}
#training-checklist-v1 #tc-autosave{margin:0 24px 12px}
#training-checklist-v1 .progress{height:6px;background:var(--tc-tonal);overflow:hidden;margin:0 24px}
#training-checklist-v1 .progress-bar{height:100%;background:var(--tc-primary)}
#training-checklist-v1 .tc-weeks{margin-top:14px}
#training-checklist-v1 .tc-week{padding:0;border-top:1px solid var(--tc-line)}
#training-checklist-v1 summary{cursor:pointer;padding:15px 4px;font-weight:600;list-style-position:inside}
#training-checklist-v1 .tc-days{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 20px;padding:8px 0 18px}
#training-checklist-v1 .tc-day{min-width:0;padding:10px 12px;background:var(--tc-surface)}
#training-checklist-v1 .tc-date{margin-bottom:8px}
#training-checklist-v1 .form-check{display:flex;align-items:flex-start;gap:10px;min-height:40px;padding:5px 0;cursor:pointer}
#training-checklist-v1 input[type=checkbox]{accent-color:var(--tc-primary);width:20px;height:20px;flex:none;margin:1px 0}
#training-checklist-v1 input:disabled{cursor:not-allowed}
#training-checklist-v1 .tc-locked{color:var(--tc-muted);padding:12px 0}
#training-checklist-v1 .tc-reward{margin-top:16px;padding:16px;background:var(--tc-tonal)}
#training-checklist-v1 .tc-reward-title{font-weight:700;margin:0 0 5px}
#training-checklist-v1 .tc-reward-note{color:var(--tc-muted);font-size:.875rem;margin:0 0 8px}
#training-checklist-v1 .tc-reward .form-check{min-height:44px;align-items:center}
#training-checklist-v1 .tc-custom,#training-checklist-v1 .tc-notes-field{width:100%;margin:8px 0 0;padding:10px 12px;border:1px solid var(--tc-line);border-bottom:2px solid var(--tc-primary);border-radius:0;background:var(--tc-card);color:var(--tc-ink);font:inherit}
#training-checklist-v1 .tc-custom{min-height:44px}
#training-checklist-v1 .tc-notes{padding:16px 0 20px;border-top:1px solid var(--tc-line)}
#training-checklist-v1 .tc-notes-label{display:block;font-size:.875rem;font-weight:700}
#training-checklist-v1 .tc-notes-field{min-height:92px;resize:vertical;font-size:1rem;line-height:1.45}
#training-checklist-v1 .tc-notes-field::placeholder{color:var(--tc-muted)}
#training-checklist-v1 .tc-backup-body{display:grid;gap:8px;padding-top:12px}
#training-checklist-v1 #tc-backup{margin:24px 24px 0;border:1px solid var(--tc-line);padding:0 16px;background:var(--tc-card)}
#training-checklist-v1 .tc-week-count{margin-left:8px;font-weight:400;color:var(--tc-muted)}
#training-checklist-v1 input:focus-visible,#training-checklist-v1 textarea:focus-visible,#training-checklist-v1 summary:focus-visible,#training-checklist-v1 a:focus-visible{outline:2px solid var(--tc-primary);outline-offset:2px}
@media(max-width:600px){#training-checklist-v1 .tc-topbar{align-items:flex-start;flex-direction:column;gap:4px;padding:12px 16px}#training-checklist-v1 .tc-navbar{padding:0 4px}#training-checklist-v1 .tc-nav-link{padding:0 12px}#training-checklist-v1 .tc-phase{margin:16px 12px 0;padding:14px}#training-checklist-v1 #tc-status{margin:18px 12px 6px}#training-checklist-v1 #tc-autosave{margin:0 12px 12px}#training-checklist-v1 .progress{margin:0 12px}#training-checklist-v1 #tc-backup{margin:20px 12px 0}#training-checklist-v1 .tc-days{grid-template-columns:1fr}}

        height <= 10_000
      ) {
        frame.style.height = Math.ceil(height) + "px";
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!Number.isFinite(height) || height <= viewportHeight) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  frame.srcdoc = srcdoc;
  delete frame.dataset.srcdoc;
})();
</script>
