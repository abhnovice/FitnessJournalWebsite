#training-checklist-v1 .tc-hero::before{content:&#x27;&#x27;;position:absolute;inset:0;background:linear-gradient(90deg,#10283be8 0%,#10283bbd 36%,transparent 76%)}
#training-checklist-v1 .tc-hero[hidden]{display:none}
#training-checklist-v1 .tc-hero-content{position:relative;padding:18px 24px;max-width:66%;text-shadow:none}
#training-checklist-v1 .tc-hero h1{color:#fff;margin:5px 0}
#training-checklist-v1 .tc-hero p{font-size:.85rem;color:#e9f3fa;margin:0}
#training-checklist-v1 .tc-hero{min-height:210px;background-position:74% top}
#training-checklist-v1 .tc-history{margin-top:18px;border:1px solid var(--tc-line);border-radius:2px;background:var(--tc-surface);overflow:hidden}
#training-checklist-v1 .tc-history summary{padding:13px 15px;font-weight:650;cursor:pointer;background:var(--tc-surface-2)}
#training-checklist-v1 .tc-history .tc-table-wrap{margin:0;border:0;border-top:1px solid var(--tc-line);border-radius:0}
:root[data-theme-choice=&quot;slate&quot;] #training-checklist-v1{--tc-canvas:#111820;--tc-surface:#17202b;--tc-surface-2:#202b38;--tc-ink:#f1f5f9;--tc-muted:#aab5c2;--tc-line:#354150;--tc-accent:#8db5e8;--tc-accent-bg:#24364a;--tc-success:#7fd1a8;--tc-success-bg:#1d3a2d;color-scheme:dark}
:root[data-theme-choice=&quot;forest&quot;] #training-checklist-v1{--tc-canvas:#0d1813;--tc-surface:#12231c;--tc-surface-2:#1a3026;--tc-ink:#edf7f1;--tc-muted:#a7c3b5;--tc-line:#294438;--tc-accent:#7fd1a8;--tc-accent-bg:#1d3a2d;--tc-success:#9addba;--tc-success-bg:#1d3a2d;color-scheme:dark}
:root[data-theme-choice=&quot;ember&quot;] #training-checklist-v1{--tc-canvas:#18100e;--tc-surface:#241815;--tc-surface-2:#30201b;--tc-ink:#fff3ee;--tc-muted:#d1aca0;--tc-line:#4c3029;--tc-accent:#ef9b78;--tc-accent-bg:#3b211b;--tc-success:#e6b37d;--tc-success-bg:#3c2b1d;color-scheme:dark}
#training-checklist-v1 .tc-eyebrow{font-size:.72rem;font-weight:650;letter-spacing:.08em;color:#d7e7f3}
#training-checklist-v1 .tc-overview{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:19px 0 13px}
#training-checklist-v1 .tc-overview .text-small{color:var(--tc-muted)}
#training-checklist-v1 #tc-page-save{display:flex;align-items:center;gap:6px;color:var(--tc-muted);font-size:.82rem;margin:-5px 0 12px}
#training-checklist-v1[data-page=home] #tc-page-save{display:none}
#training-checklist-v1 #tc-home-overview[hidden],#training-checklist-v1 #tc-dashboard[hidden],#training-checklist-v1 #tc-stats[hidden]{display:none}
#training-checklist-v1 .tc-action-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);gap:14px;align-items:stretch}
#training-checklist-v1 .tc-panel,#training-checklist-v1 .tc-metric{background:var(--tc-surface);border:1px solid var(--tc-line);border-radius:3px;box-shadow:var(--tc-shadow);min-width:0}
#training-checklist-v1 .tc-today-panel,#training-checklist-v1 .tc-phase-summary{padding:20px 22px}
#training-checklist-v1 .tc-today-title{display:flex;align-items:center;gap:9px;margin-bottom:5px;color:var(--tc-accent)}
#training-checklist-v1 #tc-today-date{font-size:.9rem;color:var(--tc-muted);margin-bottom:14px}
#training-checklist-v1 #tc-today-status{font-size:.9rem;color:var(--tc-muted);margin-bottom:10px}
#training-checklist-v1 #tc-today-list{display:grid;gap:8px}
#training-checklist-v1 .tc-today-task{border:1px solid var(--tc-line);background:var(--tc-surface-2);border-radius:2px;padding:10px 12px;min-height:50px;display:flex;align-items:center;gap:11px;cursor:pointer}
#training-checklist-v1 .tc-today-task:has(input:checked){background:var(--tc-success-bg);border-color:var(--tc-success)}
#training-checklist-v1 .tc-today-task span:last-child{font-weight:550}
#training-checklist-v1 .tc-phase-summary{display:grid;align-content:start;gap:13px}
#training-checklist-v1 .tc-summary-heading{display:flex;align-items:center;gap:8px;color:var(--tc-muted);font-size:.84rem;font-weight:650}
#training-checklist-v1 #tc-status{font-size:1.15rem;font-weight:650;margin:3px 0 4px}
#training-checklist-v1 #tc-progress{height:7px;border-radius:6px;background:var(--tc-surface-2);border:1px solid var(--tc-line);overflow:hidden}
#training-checklist-v1 #tc-bar{height:100%;background:var(--tc-accent);transition:width .18s ease}
#training-checklist-v1 #tc-autosave{display:flex;align-items:center;gap:6px;color:var(--tc-muted);font-size:.82rem;margin-top:5px}
#training-checklist-v1 #tc-next{border-top:1px solid var(--tc-line);padding-top:12px;color:var(--tc-ink);font-size:.9rem}
#training-checklist-v1 #tc-next strong{display:block;font-size:1rem;margin-top:3px}
#training-checklist-v1 #tc-journey{margin-top:25px}
#training-checklist-v1 .tc-section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 12px}
#training-checklist-v1 .tc-section-head span{font-size:.84rem;color:var(--tc-muted)}
#training-checklist-v1 .tc-journey-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
#training-checklist-v1 .tc-journey-step{min-width:0;padding:11px 12px;border:1px solid var(--tc-line);border-radius:2px;background:var(--tc-surface);display:grid;gap:4px;align-content:start}
#training-checklist-v1 .tc-journey-step[data-state=current]{border-color:var(--tc-accent);background:var(--tc-accent-bg)}
#training-checklist-v1 .tc-journey-step[data-state=complete]{border-color:var(--tc-success);background:var(--tc-success-bg)}
#training-checklist-v1 .tc-journey-step[data-state=locked]{opacity:.72}
#training-checklist-v1 .tc-journey-top{display:flex;align-items:center;justify-content:space-between;gap:4px;color:var(--tc-muted)}
#training-checklist-v1 .tc-journey-step[data-state=current] .tc-journey-top{color:var(--tc-accent)}
#training-checklist-v1 .tc-journey-step[data-state=complete] .tc-journey-top{color:var(--tc-success)}
#training-checklist-v1 .tc-journey-name{font-size:.88rem;font-weight:650;line-height:1.25;overflow-wrap:anywhere}
#training-checklist-v1 .tc-journey-state{font-size:.75rem;color:var(--tc-muted)}
#training-checklist-v1 .tc-dashboard{margin-top:26px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
#training-checklist-v1 .tc-metric{padding:18px}
#training-checklist-v1 .tc-metric h3{display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--tc-muted);margin:0 0 8px}
#training-checklist-v1 .tc-metric strong{display:block;font-size:1.2rem;line-height:1.35}
#training-checklist-v1 .tc-metric span:not(.tc-icon){font-size:.82rem;color:var(--tc-muted)}
#training-checklist-v1 .tc-metric svg:not(.tc-icon svg){display:block;width:100%;height:80px;margin-top:8px;color:var(--tc-accent)}
#training-checklist-v1 .tc-stats{background:var(--tc-surface);border:1px solid var(--tc-line);border-radius:3px;padding:20px;box-shadow:var(--tc-shadow)}
#training-checklist-v1 .tc-stats p{color:var(--tc-muted);font-size:.9rem;margin:8px 0 16px}
#training-checklist-v1 .tc-stats form{display:grid;gap:12px;margin-bottom:24px}
#training-checklist-v1 .tc-stats table{border-collapse:collapse;width:100%;min-width:840px;font-size:.87rem}
#training-checklist-v1 .tc-stats th,#training-checklist-v1 .tc-stats td{padding:9px 12px;border-bottom:1px solid var(--tc-line);text-align:left}
#training-checklist-v1 .tc-stats th{background:var(--tc-surface-2)}
#training-checklist-v1 .tc-table-wrap{overflow-x:auto}
#training-checklist-v1 .tc-stat-fields,#training-checklist-v1 .tc-week-metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:14px 0}

&lt;script id=&quot;codex-visualization-tabs&quot;&gt;
(() =&gt; {
  const selector = &#x27;.nav[role=&quot;tablist&quot;] [role=&quot;tab&quot;]&#x27;;
  const disabled = &#x27;:disabled,[aria-disabled=&quot;true&quot;]&#x27;;
  const selectTab = (selected) =&gt; {
    const panelId = selected.getAttribute(&quot;aria-controls&quot;);
    for (const tab of selected.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;)) {
      const active = tab === selected;
      tab.classList.toggle(&quot;active&quot;, active);
      tab.setAttribute(&quot;aria-selected&quot;, String(active));
      const id = tab.getAttribute(&quot;aria-controls&quot;);
      const panel = id &amp;&amp; document.getElementById(id);
      if (panel != null) {
        panel.hidden = id !== panelId;
        if (!panel.hidden &amp;&amp; selected.id) {
          panel.setAttribute(&quot;aria-labelledby&quot;, selected.id);
        }
      }
    }
  };
  const interact = (event) =&gt; {
    const tab = event.target?.closest?.(selector);
    if (event.defaultPrevented || tab == null || tab.matches(disabled)) {
      return;
    }
    if (event.type === &quot;click&quot;) {
      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;),
    ).filter((candidate) =&gt; !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === &quot;ArrowRight&quot; || event.key === &quot;ArrowDown&quot;) {
      next = (current + 1) % tabs.length;
    } else if (event.key === &quot;ArrowLeft&quot; || event.key === &quot;ArrowUp&quot;) {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === &quot;Home&quot;) {
      next = 0;
    } else if (event.key === &quot;End&quot;) {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll(&#x27;.nav[role=&quot;tablist&quot;]&#x27;)) {
    const selected =
      list.querySelector(&#x27;[role=&quot;tab&quot;][aria-selected=&quot;true&quot;]&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;].active&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;]&#x27;);
    if (selected != null) {
      selectTab(selected);
    }
  }
  document.addEventListener(&quot;click&quot;, interact);
  document.addEventListener(&quot;keydown&quot;, interact);
  window.addEventListener(&quot;pagehide&quot;, () =&gt; {
    document.removeEventListener(&quot;click&quot;, interact);
    document.removeEventListener(&quot;keydown&quot;, interact);
  }, { once: true });
})();

<script>(() => {
  const frame = document.getElementById("codex-visualization");
  if (!(frame instanceof HTMLIFrameElement)) {
    return;
  }
  const nav = document.getElementById('training-nav');
  const navToggle=document.getElementById('nav-toggle');
  navToggle.addEventListener('click',()=>{const open=nav.getAttribute('aria-expanded')!=='true';nav.setAttribute('aria-expanded',String(open));navToggle.setAttribute('aria-expanded',String(open));navToggle.setAttribute('aria-label',open?'Close navigation':'Open navigation');});
  const byowButtons=[...nav.querySelectorAll('button[data-page^="byow-"]')];
  if(byowButtons.length){const group=document.createElement('details'),summary=document.createElement('summary'),icon=byowButtons[0].querySelector('svg')?.cloneNode(true),label=document.createElement('span');label.textContent='BYOW workouts';if(icon)summary.append(icon);summary.append(label);group.append(summary);byowButtons[0].before(group);byowButtons.forEach(button=>group.append(button));}
  const unitIcon=nav.querySelector('button[data-page="gladiator-5"] svg');if(unitIcon)unitIcon.outerHTML='<svg width="20" height="20" aria-hidden="true" viewBox="0 0 20 20" fill="none"><path d="M10 2.2 16.5 5v4.1c0 4.1-2.5 7.1-6.5 8.7-4-1.6-6.5-4.6-6.5-8.7V5L10 2.2Z" stroke="currentColor" stroke-width="1.4"/><path d="m10 5.2 1.15 2.35 2.6.38-1.88 1.83.44 2.59L10 11.14l-2.31 1.21.44-2.59-1.88-1.83 2.6-.38L10 5.2Z" fill="currentColor"/></svg>';
  const themeSelect=document.getElementById('site-theme'),themeKey='stronger-self-theme-v1';let savedTheme='system';try{savedTheme=localStorage.getItem(themeKey)||'system';}catch{}if(!['system','slate','forest','ember'].includes(savedTheme))savedTheme='system';themeSelect.value=savedTheme;
  const applyTheme=theme=>{if(theme==='system')delete document.documentElement.dataset.siteTheme;else document.documentElement.dataset.siteTheme=theme;frame.contentWindow?.postMessage({channel:'training-navigation-v1',type:'theme',theme},'*');};
  themeSelect.addEventListener('change',()=>{try{localStorage.setItem(themeKey,themeSelect.value);}catch{}applyTheme(themeSelect.value);});applyTheme(savedTheme);
  const progressKey = 'training-checklist-20260921-v1';
  const routes = {home:'/',foundation:'/foundation','gladiator-0':'/general-fitness','gladiator-1':'/fat-loss','gladiator-2':'/strength-size','gladiator-3':'/rounds-of-fury','gladiator-4':'/juggernaut','gladiator-5':'/unit','body-stats':'/body-stats',...Object.fromEntries(Array.from({length:8},(_,i)=>['byow-'+i,'/byow-'+(i+1)]))};
  let currentPage = Object.keys(routes).find(key=>routes[key]===location.pathname.replace(/\/$/,'')||location.pathname==='/'&&key==='home')||'home';
  function showPage(page,push=true){
    if(!Object.hasOwn(routes,page))return;
    currentPage=page;
    if(push)history.pushState(null,'',routes[page]);nav.setAttribute('aria-expanded','false');navToggle.setAttribute('aria-expanded','false');navToggle.setAttribute('aria-label','Open navigation');
    nav.querySelectorAll('button[data-page]').forEach(button=>button.setAttribute('aria-current',button.dataset.page===page?'page':'false'));const activeButton=nav.querySelector('button[data-page="'+page+'"]');if(activeButton?.closest('details'))activeButton.closest('details').open=true;
    frame.contentWindow?.postMessage({channel:'training-navigation-v1',type:'show',page},'*');
    window.scrollTo({top:0,behavior:'instant'});
  }
  nav.addEventListener('click',event=>{const button=event.target.closest('button[data-page]');if(button)showPage(button.dataset.page);});
  window.addEventListener('popstate',()=>{const page=Object.keys(routes).find(key=>routes[key]===location.pathname)||'home';showPage(page,false);});
  frame.addEventListener('load',()=>{showPage(currentPage,false);applyTheme(themeSelect.value);});
  const blank = {version:2,checked:{},rewards:{claimed:{},custom:{},locked:{}},notes:{},weekly:{},measurements:[]};
  function upgrade(record){
    if(!record||typeof record!=='object'||(record.version!==1&&record.version!==2))return blank;
    return {...blank,...record,version:2,rewards:{...blank.rewards,...record.rewards},weekly:record.weekly||{},measurements:record.measurements||[]};
  }
  function validProgress(record){
    if(!record||record.version!==2||!record.checked||typeof record.checked!=='object'||Array.isArray(record.checked))return false;
    if(Object.keys(record.checked).length>1000)return false;
    if(!Object.entries(record.checked).every(([key,value])=>/^(launchpad|cardio|circuit|gladiator-[0-5]|byow-[0-7])-\d{1,2}-[01]$/.test(key)&&value===true))return false;
    if(JSON.stringify(record).length>150000)return false;
    return true;
  }
  let saveQueue=Promise.resolve();
  globalThis.addEventListener('message',event=>{
    if(event.source!==frame.contentWindow||event.origin!=='null'||event.data?.channel!=='training-progress-v1')return;
    const message=event.data;
    if(message.type==='load'){
      (async()=>{
        try{
          const response=await fetch('/api/progress',{credentials:'same-origin',cache:'no-store'});
          if(!response.ok)throw new Error('Account storage unavailable');
          const data=await response.json();
          let record=upgrade(data.record);
          if(!data.hasSavedRecord){
            try{const saved=localStorage.getItem(progressKey);if(saved){const old=upgrade(JSON.parse(saved));if(validProgress(old)){record=old;await fetch('/api/progress',{method:'PUT',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify(old)});}}}catch{}
          }
          frame.contentWindow?.postMessage({channel:'training-progress-v1',type:'loaded',ok:true,record},'*');
        }catch{frame.contentWindow?.postMessage({channel:'training-progress-v1',type:'loaded',ok:false,record:blank},'*');}
      })();
    }else if(message.type==='save'&&Number.isSafeInteger(message.revision)&&validProgress(message.record)){
      saveQueue=saveQueue.then(async()=>{
        let ok=false;
        try{const response=await fetch('/api/progress',{method:'PUT',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify(message.record)});ok=response.ok;}catch{}
        frame.contentWindow?.postMessage({channel:'training-progress-v1',type:'saved',revision:message.revision,ok},'*');
      });
    }
  });
  let viewportHeight = globalThis.innerHeight;

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height === "number" &&
        Number.isFinite(height) &&
        height >= 0 &&
        height <= 10_000
      ) {
        frame.style.height = Math.ceil(height) + "px";
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!Number.isFinite(height) || height <= viewportHeight) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  frame.srcdoc = srcdoc;
  delete frame.dataset.srcdoc;
})();
</script>
